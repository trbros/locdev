# LocDev framework definitions (format 2: adds `processes`).
#
# Pure data read by the native engine in crates/locdev-frameworks: how each
# stack is recognized, where its version comes from, how its dev server takes
# a host and port, and how it loads .env files. Nothing here is run during
# detection; `install`/`build`/`test` are shown to the user, never run.
# `{pm}` in those three is the project's package manager.
#
# Published signed (tools/definitions) so LocDev can update these without a
# new release. Bump `revision` on every change; add a field or rule kind only
# together with the engine, and then bump `format`.

format = 2
revision = 2026112401
min_locdev = "0.1.0"

# ── PHP ─────────────────────────────────────────────────────────────────────

[[framework]]
id = "laravel"
name = "Laravel"
category = "framework"
family = "laravel"
priority = 100
docs = "https://laravel.com/docs"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mariadb", "queue", "horizon", "scheduler", "reverb", "mailpit", "s3", "meilisearch", "vite"]
runtimes = ["php", "composer"]
detect.all = [{ file = "artisan" }, { file = "composer.json" }]
version = [{ composer = "laravel/framework" }]
supported = ">=10"
# --no-reload: otherwise `serve` drops every variable in $_ENV that isn't on
# its passthrough list before starting `php -S` (PHP builds default to
# variables_order=EGPCS), which loses what LocDev injects. LocDev restarts
# the site instead; edits to .env need a restart.
dev = [{ command = "php artisan serve --host=127.0.0.1 --port={port} --no-reload" }]
notes = ["artisan serve runs with --no-reload so the variables LocDev injects reach the PHP server; restart the site after editing .env."]
helper = "vite"
install = "composer install"
test = "php artisan test"
config_files = ["config/app.php", "config/database.php", "phpunit.xml", "vite.config.js", "vite.config.ts"]
implies = ["php"]
processes = [
  { id = "queue", name = "Queue worker", kind = "worker", run = [{ command = "php artisan queue:work" }], conflicts = ["horizon"], note = "Restart it after changing job code: a running worker keeps the old code in memory." },
  { id = "horizon", name = "Horizon", kind = "worker", requires_any = [{ composer = "laravel/horizon" }], run = [{ command = "php artisan horizon" }], conflicts = ["queue"], note = "Horizon runs the Redis queue workers itself; don't run queue:work next to it." },
  { id = "scheduler", name = "Scheduler", kind = "scheduler", run = [{ command = "php artisan schedule:work" }] },
  { id = "reverb", name = "Reverb", kind = "websocket", requires_any = [{ composer = "laravel/reverb" }], run = [{ command = "php artisan reverb:start" }], note = "Reverb listens on REVERB_SERVER_HOST/REVERB_SERVER_PORT from .env (8080 by default); give each project its own port there." },
]

[[framework]]
id = "wordpress"
name = "WordPress"
category = "framework"
family = "wordpress"
priority = 95
docs = "https://developer.wordpress.org/advanced-administration/"
services = ["mysql", "mariadb", "redis", "wpcron", "mailpit"]
runtimes = ["php"]
# Bedrock (roots/bedrock) keeps WordPress under web/ and its settings in
# config/application.php and .env.
detect.any = [{ file = "wp-config.php" }, { file = "wp-load.php" }, { file = "web/wp-config.php" }]
dev = [
  { when = [{ file = "web/wp-config.php" }], command = "php -S 127.0.0.1:{port} -t web" },
  { command = "php -S 127.0.0.1:{port} -t ." },
]
config_files = ["wp-config.php", "config/application.php", ".env"]
implies = ["php"]
notes = ["PHP's built-in server ignores .htaccess; pretty permalinks work only through index.php routing.", "Bedrock is served from web/ (WordPress itself in web/wp, the admin at /wp/wp-admin); its database and WP_HOME come from .env."]

[[framework]]
id = "php"
name = "PHP"
category = "language"
family = "php"
priority = 20
docs = "https://www.php.net/manual/en/features.commandline.webserver.php"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "mariadb", "rabbitmq", "messenger", "mailpit", "s3", "meilisearch"]
