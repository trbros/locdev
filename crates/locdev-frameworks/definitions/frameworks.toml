[[framework]]
id = "html"
name = "HTML5"
category = "language"
family = "static"
priority = 1
docs = "https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Tools_and_setup/set_up_a_local_testing_server"
services = ["mock"]
detect.any = [{ file = "index.html" }, { file = "public/index.html" }]
# LocDev's own static server (`locdevd static`): loopback only, clean URLs,
# 404.html; no Python or Node needed.
dev = [
  { when = [{ file = "index.html" }], command = "locdevd static --port {port}" },
  { command = "locdevd static --port {port} --root public" },
]
notes = ["Served by LocDev's built-in static server (clean URLs, 404.html, no cache); change the command with `locdev edit` to use another one."]

# ── Python ──────────────────────────────────────────────────────────────────

[[framework]]
id = "django"
name = "Django"
category = "framework"
priority = 90
docs = "https://docs.djangoproject.com/en/stable/ref/django-admin/#runserver"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "rabbitmq", "celery", "beat", "channels", "mailpit", "s3", "meilisearch"]
runtimes = ["python"]
requires = ["python3"]
venv = true
detect.all = [{ file = "manage.py" }]
version = [{ python = "django" }]
dev = [{ command = "python3 manage.py runserver 127.0.0.1:{port}", command_windows = "python manage.py runserver 127.0.0.1:{port}" }]
install = "python3 -m pip install -r requirements.txt"
test = "python3 manage.py test"
implies = ["python"]
notes = ["Django answers only the hosts in ALLOWED_HOSTS (with it empty and DEBUG on, only localhost): add \".test\" for the site's address, and SECURE_PROXY_SSL_HEADER = (\"HTTP_X_FORWARDED_PROTO\", \"https\") so pages and CSRF checks see HTTPS behind LocDev's proxy. Projects LocDev creates get both, under `if DEBUG:`."]
processes = [
  { id = "celery", name = "Celery worker", kind = "worker", requires_any = [{ python = "celery" }], run = [{ command = "celery -A {django_module} worker -l info" }], note = "Celery needs its broker running (Redis or RabbitMQ, CELERY_BROKER_URL)." },
  { id = "beat", name = "Celery beat", kind = "scheduler", requires_any = [{ python = "celery" }], run = [{ command = "celery -A {django_module} beat -l info" }], note = "Run a single beat per project, or tasks are scheduled twice." },
]
env = { if_any = [{ python = "django-environ" }, { python = "python-dotenv" }, { python = "django-dotenv" }], files = [".env"], loader = "python-dotenv/django-environ", notes = ["Django reads .env only through django-environ or python-dotenv, which keep a variable already in the environment."] }

[[framework]]
id = "flask"
name = "Flask"
category = "framework"
priority = 80
docs = "https://flask.palletsprojects.com/en/stable/cli/"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "rabbitmq", "celery", "beat", "mailpit", "s3", "meilisearch"]
runtimes = ["python"]
requires = ["flask"]
venv = true
detect.any = [{ python = "flask" }]
version = [{ python = "flask" }]
dev = [
  { when = [{ file = "app.py" }], command = "flask --app app run --host 127.0.0.1 --port {port}" },
  { when = [{ file = "wsgi.py" }], command = "flask --app wsgi run --host 127.0.0.1 --port {port}" },
  { when = [{ file = "app/__init__.py" }], command = "flask --app app run --host 127.0.0.1 --port {port}" },
]
install = "python3 -m pip install -r requirements.txt"
implies = ["python"]
env = { if_any = [{ python = "python-dotenv" }], files = [".env", ".flaskenv"], loader = "Flask CLI (python-dotenv)", notes = ["The flask command loads .env and .flaskenv when python-dotenv is installed; a variable already in the environment wins."] }

[[framework]]
id = "fastapi"
name = "FastAPI"
category = "framework"
priority = 80
docs = "https://fastapi.tiangolo.com/fastapi-cli/"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "rabbitmq", "celery", "beat", "mailpit", "s3", "meilisearch"]
runtimes = ["python"]
requires = ["fastapi"]
venv = true
detect.any = [{ python = "fastapi" }]
version = [{ python = "fastapi" }]
dev = [
  { when = [{ file = "main.py" }], command = "fastapi dev main.py --host 127.0.0.1 --port {port}" },
  { when = [{ file = "app/main.py" }], command = "fastapi dev app/main.py --host 127.0.0.1 --port {port}" },
]
install = "python3 -m pip install -r requirements.txt"
implies = ["python"]
notes = ["`fastapi dev` comes with the fastapi[standard] extra."]
env = { if_any = [{ python = "pydantic-settings" }, { python = "python-dotenv" }], files = [".env"], loader = "pydantic-settings/python-dotenv", notes = ["FastAPI reads .env only through pydantic-settings or python-dotenv; the environment wins over the file."] }

[[framework]]
id = "python"
name = "Python"
