# ── Ruby ────────────────────────────────────────────────────────────────────

[[framework]]
id = "rails"
name = "Ruby on Rails"
category = "framework"
priority = 90
docs = "https://guides.rubyonrails.org/command_line.html#bin-rails-server"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "solidqueue", "sidekiq", "cable", "mailpit", "s3"]
runtimes = ["ruby"]
requires = ["ruby", "bundle"]
detect.any = [{ gem = "rails" }, { file = "config/application.rb" }]
detect.all = [{ file = "Gemfile" }]
version = [{ gem = "rails" }]
dev = [{ command = "bin/rails server -b 127.0.0.1 -p {port}", command_windows = "ruby bin/rails server -b 127.0.0.1 -p {port}" }]
install = "bundle install"
build = "bin/rails assets:precompile"
test = "bin/rails test"
config_files = ["config/database.yml", "config/application.rb", "Gemfile"]
implies = ["ruby"]
processes = [
  { id = "jobs", name = "Solid Queue", kind = "worker", requires_any = [{ gem = "solid_queue" }], run = [{ when = [{ file = "bin/jobs" }], command = "bin/jobs" }], conflicts = ["sidekiq"], note = "Solid Queue's supervisor also runs recurring tasks (config/recurring.yml)." },
  { id = "sidekiq", name = "Sidekiq", kind = "worker", requires_any = [{ gem = "sidekiq" }], run = [{ command = "bundle exec sidekiq" }], conflicts = ["jobs"], note = "Sidekiq needs Redis (REDIS_URL)." },
]
notes = ["Rails checks the Host header in development: add the site's domain with config.hosts << \".test\" in config/environments/development.rb."]
env = { if_any = [{ gem = "dotenv" }, { gem = "dotenv-rails" }], files = [".env.development.local", ".env.local", ".env.development", ".env"], loader = "dotenv", notes = ["Rails reads .env files only through the dotenv gem, which keeps a variable already in the environment."] }

[[framework]]
id = "ruby"
name = "Ruby"
category = "language"
priority = 5
docs = "https://bundler.io/guides/getting_started.html"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "rabbitmq", "sidekiq", "mailpit", "s3", "meilisearch"]
runtimes = ["ruby"]
requires = ["ruby"]
detect.any = [{ file = "Gemfile" }]
install = "bundle install"
notes = ["Ruby alone doesn't define an HTTP server; set the command that starts yours (rackup -p {port}, puma…)."]

# ── Compiled languages ──────────────────────────────────────────────────────

[[framework]]
id = "go"
name = "Go"
category = "language"
priority = 30
docs = "https://go.dev/doc/tutorial/"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "rabbitmq", "asynq", "mailpit", "s3", "meilisearch"]
runtimes = ["go"]
requires = ["go"]
detect.any = [{ file = "go.mod" }]
dev = [{ command = "go run .", port = "env", note = "Go has no standard port flag; the program must read PORT (os.Getenv(\"PORT\"))." }]
install = "go mod download"
build = "go build ./..."
test = "go test ./..."
config_files = ["go.mod"]

[[framework]]
id = "rust"
name = "Rust"
category = "language"
priority = 30
docs = "https://doc.rust-lang.org/cargo/commands/index.html"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "rabbitmq", "apalis", "mailpit", "s3", "meilisearch"]
runtimes = ["rust"]
requires = ["cargo"]
detect.any = [{ file = "Cargo.toml" }]
# A workspace root without [package] has nothing to run; its members are listed instead.
dev = [{ when = [{ contains = ["Cargo.toml", "[package]"] }], command = "cargo run", port = "env", note = "Cargo has no port flag; the program must read PORT (std::env::var(\"PORT\"))." }]
install = "cargo fetch"
build = "cargo build --release"
test = "cargo test"
config_files = ["Cargo.toml"]

[[framework]]
id = "spring"
name = "Spring Boot"
category = "framework"
priority = 90
docs = "https://docs.spring.io/spring-boot/maven-plugin/run.html"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "sqlserver", "rabbitmq", "springjobs", "mailpit", "s3", "meilisearch"]
runtimes = ["java"]
requires = ["java"]
detect.any = [{ maven = "spring-boot" }, { gradle = "org.springframework.boot" }]
version = [{ maven = "spring-boot-starter-parent" }, { gradle = "org.springframework.boot" }]
dev = [
  { when = [{ file = "mvnw" }], command = "./mvnw spring-boot:run", command_windows = "mvnw.cmd spring-boot:run", port = "env", port_env = ["SERVER_PORT", "SERVER_ADDRESS=127.0.0.1"] },
  { when = [{ file = "gradlew" }], command = "./gradlew bootRun", command_windows = "gradlew.bat bootRun", port = "env", port_env = ["SERVER_PORT", "SERVER_ADDRESS=127.0.0.1"] },
  { when = [{ file = "pom.xml" }], command = "mvn spring-boot:run", port = "env", port_env = ["SERVER_PORT", "SERVER_ADDRESS=127.0.0.1"] },
  { command = "gradle bootRun", port = "env", port_env = ["SERVER_PORT", "SERVER_ADDRESS=127.0.0.1"] },
]
install = "./mvnw dependency:resolve"
build = "./mvnw package"
test = "./mvnw test"
config_files = ["src/main/resources/application.properties", "src/main/resources/application.yml", "pom.xml", "build.gradle"]
implies = ["java"]
notes = ["The port reaches Spring Boot through SERVER_PORT (relaxed binding of server.port)."]
env = { loader = "none", notes = ["Spring Boot doesn't read .env files by itself."] }

[[framework]]
id = "java"
name = "Java"
category = "language"
priority = 5
docs = "https://maven.apache.org/guides/getting-started/maven-in-five-minutes.html"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "sqlserver", "rabbitmq", "mailpit", "s3", "meilisearch"]
