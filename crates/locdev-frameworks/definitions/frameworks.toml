  { when = [{ file = "public/index.php" }], command = "php -S 127.0.0.1:{port} -t public" },
  { command = "php -S 127.0.0.1:{port} -t ." },
]
install = "composer install"
config_files = ["composer.json", "phpunit.xml"]

