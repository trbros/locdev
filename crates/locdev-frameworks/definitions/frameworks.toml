[[framework]]
id = "dotnet"
name = ".NET"
category = "framework"
priority = 30
docs = "https://learn.microsoft.com/en-us/aspnet/core/fundamentals/servers/kestrel/endpoints"
services = ["postgres", "mysql", "sqlite", "redis", "valkey", "mongodb", "sqlserver", "rabbitmq", "hangfire", "signalr", "mailpit", "s3", "meilisearch"]
runtimes = ["dotnet"]
requires = ["dotnet"]
detect.any = [{ glob = "*.csproj" }, { glob = "*.fsproj" }, { glob = "*.sln" }]
version = [{ nuget = "TargetFramework" }]
dev = [{ command = "dotnet run --no-launch-profile", port = "env", port_env = ["ASPNETCORE_URLS=http://127.0.0.1:{port}", "ASPNETCORE_ENVIRONMENT=Development"], note = "--no-launch-profile keeps launchSettings.json from replacing the address, so LocDev sets ASPNETCORE_ENVIRONMENT=Development (what the launch profile sets; static assets and the developer error page need it) unless the site's environment already has it; with several projects in a solution, set the command to `dotnet run --project <path>`." }]
install = "dotnet restore"
build = "dotnet build"
test = "dotnet test"
config_files = ["appsettings.json", "appsettings.Development.json"]
env = { loader = "none", notes = [".NET doesn't read .env files by itself."] }

# ── Static site generators ──────────────────────────────────────────────────

[[framework]]
id = "hugo"
name = "Hugo"
category = "framework"
priority = 80
docs = "https://gohugo.io/commands/hugo_server/"
services = ["mock"]
requires = ["hugo"]
detect.any = [{ file = "hugo.toml" }, { file = "hugo.yaml" }, { file = "hugo.json" }, { file = "archetypes/default.md" }]
dev = [{ command = "hugo server --bind 127.0.0.1 --port {port}" }]
build = "hugo --minify"
config_files = ["hugo.toml", "hugo.yaml", "config.toml"]
notes = ["Live reload connects to the server's own port; it works at http://127.0.0.1:<port>, and through the proxy only with --liveReloadPort set to the proxy's port."]
env = { loader = "none", notes = ["Hugo reads HUGO_* variables from the environment, not .env files."] }
