<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocDev</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- Theme before first paint, so a reload (changing the language) never
         flashes white while the bundle loads. Colors = --background in index.css. -->
    <script src="/splash-theme.js"></script>
    <style>
      html {
        background: oklch(0.975 0.006 85);
        color-scheme: light;
      }
      html.dark {
        background: oklch(0.175 0.006 60);
        color-scheme: dark;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #boot img {
        width: 56px;
        height: 56px;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <!-- Shown until React renders into #root (it replaces this). -->
    <div id="root"><div id="boot"><img src="/logo.png" alt="" draggable="false" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
